name: Release CI
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  x64_build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build TrafficMonitor x64
        run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143
      - uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor_x64_Lite
          path: |
            Bin/x64/Release (lite)/TrafficMonitor.exe
            Bin/x64/Release (lite)/*.dll
